services:
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: bdinvite-benchmark-oidc
    ports:
      - "8088:8080"
    volumes:
      - ./config.json:/config.json:ro
    environment:
      - JSON_CONFIG_PATH=/config.json
      - SERVER_PORT=8080
    restart: unless-stopped
